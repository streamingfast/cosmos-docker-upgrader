name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  NFPM_VERSION: v2.47.0

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            package: true
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            package: true
          - goos: darwin
            goarch: arm64
            runner: ubuntu-24.04
            package: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract version
        id: version
        run: |
          version="${GITHUB_SHA::7}"
          # nfpm wants a parseable semver, which a bare sha is not
          pkg_version="0.0.0-dev.${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            # Debian versions must not carry the leading v
            pkg_version="${version#v}"
          fi

          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"
          echo "PKG_VERSION=${pkg_version}" >> "$GITHUB_OUTPUT"

      # The build stage always runs natively and cross compiles, so GOOS/GOARCH
      # are passed explicitly and no emulation is ever involved.
      - name: Build binary
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: binary
          outputs: type=local,dest=dist
          build-args: |
            GOOS=${{ matrix.goos }}
            GOARCH=${{ matrix.goarch }}
            VERSION=${{ steps.version.outputs.VERSION }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.goos }}-${{ matrix.goarch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Inspect binary
        run: |
          chmod +x dist/cosmos-docker-upgrader
          file dist/cosmos-docker-upgrader

      # Each linux job runs on a runner of its own architecture, so the binary it
      # just produced can actually be executed here.
      - name: Smoke test binary
        if: matrix.goos == 'linux'
        run: dist/cosmos-docker-upgrader --version

      - name: Build deb package
        if: matrix.package
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e PKG_VERSION="${{ steps.version.outputs.PKG_VERSION }}" \
            -e PKG_ARCH="${{ matrix.goarch }}" \
            goreleaser/nfpm:${{ env.NFPM_VERSION }} \
            package --config nfpm.yaml --packager deb --target dist

          # Installing it is the only way to know the package is actually sane
          sudo dpkg --install dist/*.deb
          dpkg --listfiles cosmos-docker-upgrader

          # dpkg reports excluded paths as installed, so assert they really landed
          test -x /usr/bin/cosmos-docker-upgrader
          test -f /lib/systemd/system/cosmos-docker-upgrader@.service
          test -f /usr/share/cosmos-docker-upgrader/example.env
          test -d /etc/cosmos-docker-upgrader

          systemd-analyze verify /lib/systemd/system/cosmos-docker-upgrader@.service || true

      - name: Stage artifacts
        run: |
          mkdir -p artifacts
          cp dist/cosmos-docker-upgrader "artifacts/cosmos-docker-upgrader-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [[ -n "$(ls dist/*.deb 2>/dev/null)" ]]; then
            cp dist/*.deb artifacts/
          fi
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cosmos-docker-upgrader-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        working-directory: artifacts
        run: |
          sha256sum cosmos-docker-upgrader-* cosmos-docker-upgrader_*.deb > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
